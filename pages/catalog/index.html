<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalog Models</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../libraries/fontawesome/css/all.min.css">
    <script src="../../libraries/scripts/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn3.devexpress.com/jslib/25.2.3/css/dx.fluent.blue.light.compact.css">
    <script src="../../libraries/scripts/dx-quill.min.js"></script>
    <script src="../../libraries/scripts/dx.all.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atma:wght@400;600;700&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Nunito:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet"/>
    <link rel="icon" type="image/svg+xml" href="../../scripts/themes/modellus.svg">
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="../../scripts/catalog/assetPreview.css">
    <link rel="stylesheet" href="catalog.css">
  </head>
  <body>
    <div class="shell">
      <nav class="nav">
        <a href="/index.html" class="logo" aria-label="Modellus">
          <img src="../../scripts/themes/modellus.svg" alt="Modellus logo" style="width: 28px; height: 28px;">
          <span>Modellus</span>
        </a>
        <div id="nav-toolbar"></div>
      </nav>
      <section id="page-models" class="page">
        <span id="status" class="status"></span>
        <div id="drawer-shell" class="drawer-shell">
          <div id="drawer" class="drawer-panel"></div>
          <div class="drawer-content">
            <div id="content-header" class="content-header">
              <div class="content-heading">
                <h1 id="content-title" class="content-title"></h1>
                <div id="content-count" class="content-count"></div>
              </div>
              <div class="content-tools">
                <div class="content-search">
                  <i class="fa-light fa-magnifying-glass content-search-icon" aria-hidden="true"></i>
                  <input id="content-search-input" class="content-search-input" type="text" autocomplete="off">
                </div>
                <button id="content-filter-button" class="content-tool-button" type="button">
                  <i class="fa-light fa-filter" aria-hidden="true"></i>
                  <span id="content-filter-label"></span>
                  <span id="content-filter-badge" class="content-filter-badge"></span>
                </button>
                <div id="content-sort" class="content-sort"></div>
                <div class="content-view-toggle">
                  <button id="content-view-grid" class="content-view-button is-active" type="button"><i class="fa-light fa-grid-2" aria-hidden="true"></i></button>
                  <button id="content-view-list" class="content-view-button" type="button"><i class="fa-light fa-list" aria-hidden="true"></i></button>
                </div>
              </div>
            </div>
            <div class="card-view-shell">
              <div id="models-card-view" class="card-view"></div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script src="../../modellus.js"></script>
    <script src="../../libraries/types/CalculationEngine.js"></script>
    <script src="../../scripts/calculator.js"></script>
    <script src="../../scripts/utils.js"></script>
    <script src="../../scripts/ClipboardService.js"></script>
    <script src="../../scripts/controls/ImageControl.js"></script>
    <script src="../../scripts/shell/modelSavePopup.js"></script>
    <script src="../../scripts/controls/AxisTickDrag.js"></script>
    <script src="../../scripts/controls/AxisRangeControl.js"></script>
    <script src="../../scripts/blocks/designTokens.js"></script>
    <script src="../../scripts/blocks/blockGeometry.js"></script>
    <script src="../../scripts/blocks/blockKeyboard.js"></script>
    <script src="../../scripts/blocks/blockChartGeometry.js"></script>
    <script src="../../scripts/blocks/blockMemory.js"></script>
    <script src="../../scripts/blocks/blockBindings.js"></script>
    <script src="../../scripts/blocks/blockRegistry.js"></script>
    <script src="../../scripts/blocks/blockPrimitives.js"></script>
    <script src="../../scripts/blocks/blockModifiers.js"></script>
    <script src="../../scripts/blocks/blockBehaviours.js"></script>
    <script src="../../scripts/blocks/blockMigrations.js"></script>
    <script src="../../scripts/blocks/blockCompiler.js"></script>
    <script src="../../scripts/blocks/blockRenderer.js"></script>
    <script src="../../scripts/blocks/blockValidator.js"></script>
    <script src="../../scripts/blocks/blockComponents.js"></script>
    <script src="../../scripts/blocks/blockMemoryComponents.js"></script>
    <script src="../../scripts/blocks/blockChartComponents.js"></script>
    <script src="../../scripts/blocks/blockDefinitionLoader.js"></script>
    <script src="../../scripts/blocks/blockSvgImport.js"></script>
    <script src="../../scripts/blocks/definitions/definitions.generated.js"></script>
    <script src="../../scripts/blocks/blockObjectLibrary.js"></script>
    <script src="../../scripts/blocks/blockObjects.js"></script>
    <script src="../../scripts/catalog/objectDrawing.js"></script>
    <script src="../../scripts/catalog/objectSeeder.js"></script>
    <script src="../../scripts/catalog/assetPreview.js"></script>
    <script type="module" src="catalog.js"></script>
  </body>
</html>
